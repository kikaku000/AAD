<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before That</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 點陣字體 DotGothic16 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <!-- 自訂 CSS -->
  <link rel="stylesheet" href="style.css">
  <style>
    #endingActions {
      display: flex !important;
      justify-content: center !important;
      width: 100% !important;
    }
    #endingActions a.ending-link {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col justify-center items-center bg-jp-softbg text-gray-100 bg-grid relative select-none overflow-hidden font-normal">

  <!-- 主遊戲容器 (全螢幕滿版) -->
  <div id="gameContainer" class="w-full h-full flex flex-col justify-between relative bg-black/70 overflow-hidden">

    <!-- ==================== 主線文字冒險 (Visual Novel UI) ==================== -->
    <div id="phaseVN" onclick="handleDialogClick()" class="w-full h-full flex flex-col justify-between relative p-4 md:p-6 bg-cover bg-center transition-all duration-700 cursor-pointer">
      
      <!-- 動態背景圖層 -->
      <div id="bgImageLayer" class="absolute inset-0 bg-cover bg-center z-0 opacity-40 transition-all duration-500"></div>

      <!-- 🌟 全螢幕背景式立繪圖層 (滿版 1920x1080 對齊底部) -->
      <div id="characterSpriteContainer" class="absolute inset-0 w-full h-full pointer-events-none z-5 overflow-hidden flex items-end justify-center">
        <img id="characterSprite" src="" alt="角色立繪" class="w-full h-full object-cover object-bottom filter drop-shadow-[0_8px_20px_rgba(240,139,147,0.4)]">
      </div>

      <!-- 中央空容器（保留給選擇肢按鈕定位） -->
      <div class="flex-1 flex flex-col items-center justify-end relative my-0 z-10 pointer-events-none">
        <!-- 選擇肢按鈕選單 -->
        <div id="choiceContainer" class="absolute bottom-6 flex flex-col gap-3 w-full max-w-xs px-4 opacity-0 pointer-events-none transition-all duration-500 z-20">
          <!-- JS 動態插入 -->
        </div>
      </div>

      <!-- 底部日系對話框 -->
      <div id="dialogBox" class="jp-border-box bg-jp-boxbg rounded-xl p-4 md:p-6 relative z-20 hover:border-jp-pink/90 transition-all">
        <div class="jp-corner-tl"></div>
        <div class="jp-corner-tr"></div>
        <div class="jp-corner-bl"></div>
        <div class="jp-corner-br"></div>

        <!-- 角色名字標籤（無 Icon、純文字） -->
        <div class="absolute -top-4 left-6 bg-jp-peach text-white text-xs md:text-sm font-normal px-4 py-1 rounded-md shadow-md border border-jp-pink flex items-center">
          <span id="speakerName">主角</span>
        </div>

        <div class="mt-2 min-h-[65px] md:min-h-[80px] text-sm md:text-base leading-relaxed tracking-wide text-gray-100 font-normal">
          <p id="dialogText" class="dialogue-text inline"></p>
          <span id="dialogCursor" class="cursor-blink hidden"></span>
        </div>

        <div class="w-full flex justify-end items-center mt-1 text-xs text-jp-lightpink/70 font-normal">
          <span class="animate-pulse">▼</span>
        </div>
      </div>
    </div>

    <!-- ==================== 階段三：像素動物躲避小遊戲 (完美正圓形版) ==================== -->
    <div id="phaseMiniGame" class="hidden w-full h-full flex-col justify-between items-center p-3 md:p-6 relative bg-[#120e10]">
      
      <!-- 發光濾鏡定義 -->
      <svg class="absolute w-0 h-0 opacity-0 pointer-events-none">
        <defs>
          <filter id="circle-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f08b93" flood-opacity="0.8"/>
            <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#e06d75" flood-opacity="0.5"/>
          </filter>
        </defs>
      </svg>

      <!-- 中央正圓形遊戲容器 -->
      <div id="circleContainerWrapper" class="relative flex items-center justify-center filter-[url(#circle-glow)] my-auto">
        
        <!-- Canvas 遊戲本體區 -->
        <div id="canvasWrapper" class="w-full h-full relative flex items-center justify-center overflow-hidden bg-black/90 rounded-full border-2 border-[#f08b93] shadow-lg">
          <canvas id="gameCanvas" class="w-full h-full block rounded-full"></canvas>

          <div id="gameOverlay" class="absolute inset-0 bg-[#2d1217]/90 backdrop-blur-sm hidden flex-col items-center justify-center text-center p-6 z-30 rounded-full">
            <div class="text-jp-pink text-4xl md:text-5xl font-normal mb-2 animate-bounce">(๑‾᷅^‾᷅๑)</div>
            <h2 class="text-2xl md:text-3xl font-normal text-[#fcd3c1] tracking-wider mb-2">大失敗！</h2>
            <p class="text-sm md:text-base text-gray-300 mb-6 max-w-md font-normal">好想看動物好想看動物好想看動物好想看動物好想看動物</p>
            <button onclick="endMiniGameAndReturn()" class="jp-btn px-8 py-3 rounded-full text-white text-sm md:text-base shadow-lg flex items-center justify-center gap-2">
              <span>放棄抵抗 ➔</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 底部手機操控列 -->
      <div class="w-full flex justify-between items-center px-4 md:hidden z-10">
        <button id="btnTouchLeft" class="jp-btn w-20 py-3 rounded-xl text-center text-lg active:scale-95 text-jp-pink">
          ◀
        </button>
        <span class="text-[11px] text-gray-400 font-normal">左右滑動或點擊按鈕躲避</span>
        <button id="btnTouchRight" class="jp-btn w-20 py-3 rounded-xl text-center text-lg active:scale-95 text-jp-pink">
          ▶
        </button>
      </div>
    </div>

<!-- ==================== 階段五：懸念結局幕 (文字置中、Q版在上方、無卡片框) ==================== -->
    <div id="phaseEnding" class="hidden w-full h-full flex flex-col justify-center items-center px-6 md:px-12 bg-black z-30 relative font-normal overflow-hidden">
      
      <!-- 階段五動態背景圖層 -->
      <div id="endingBgLayer" class="absolute inset-0 bg-cover bg-center z-0 opacity-30 transition-all duration-700"></div>

      <!-- 置中容器：Q版角色在上，文字與按鈕在下 -->
      <div class="w-full max-w-2xl flex flex-col items-center justify-center text-center relative z-10 gap-8 my-auto">
        
        <!-- Q版角色圖 (置於文字上方) -->
        <div class="w-40 h-40 md:w-40 md:h-40 flex items-center justify-center">
          <img id="chibiSprite" src="https://images.plurk.com/5VqqTO3QALwHkAnJwSNkwK.png" alt="Q版角色大圖" class="w-full h-full object-contain filter drop-shadow-[0_0_15px_rgba(240,139,147,0.4)] animate-pulse">
        </div>

        <!-- 打字機文字區 (全部置中) -->
        <div id="endingTextContainer" class="w-full space-y-4 text-base md:text-lg leading-relaxed text-gray-200 font-normal tracking-wide min-h-[140px] text-center">
          <!-- JS 動態寫入結尾故事 -->
        </div>

        <!-- 底部互動按鈕 (置中) -->
        <div id="endingActions" class="mt-2 opacity-0 transition-opacity duration-1000 flex justify-center w-full">
          <a href="https://www.plurk.com/u/donko" target="_blank" class="ending-link text-jp-lightpink hover:text-white transition-colors duration-200 text-sm md:text-base tracking-wider no-underline flex items-center gap-2 group font-normal">
            <span class="underline underline-offset-4">醒來後的他</span>
            <span class="arrow-slide inline-block no-underline text-xs">➔</span>
            <img src="https://images.plurk.com/6LF1iYUZTXbXj584ffYBwu.gif" alt="小像素圖" class="pixel-avatar w-5 h-5 object-contain inline-block transition-transform duration-200 group-hover:scale-110">
          </a>
        </div>

      </div>
    </div>
  <script src="script.js"></script>
  <script>
    window.onload = function() {
      initStoryPage();
    };
  </script>

  <!-- 背景音樂檔案 (可替換為您的 MP3 網址) -->
  <audio id="bgmAudio" src="./Discoveryland - area Music Loop - Disneyland Paris - DLP Welcome Music (1).mp3" loop preload="auto"></audio>
</body>
</html>
